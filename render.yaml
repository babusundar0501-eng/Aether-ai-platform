services:
  - type: web
    name: aether-ai-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AETHER_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AETHER_DB_PATH
        value: /var/data/aether.db
    disk:
      name: aether-data
      mountPath: /var/data
      sizeGB: 1
