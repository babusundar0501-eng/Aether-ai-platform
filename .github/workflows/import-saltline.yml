name: Import and rebrand original Saltline game

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-saltline.yml"

permissions:
  contents: write

jobs:
  import-original-game:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download original game and apply branding only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          url = "https://raw.githubusercontent.com/realcodebear/saltline-fable-5.2/main/index.html"
          request = Request(url, headers={"User-Agent": "BLACKTIDE-source-import/1.0"})
          with urlopen(request, timeout=60) as response:
              html = response.read().decode("utf-8")

          if len(html) < 500_000:
              raise SystemExit(f"Unexpectedly small source file ({len(html)} chars); refusing to replace the game.")

          # Preserve gameplay, graphics, models, sounds and mechanics.
          # Only change visible project branding and document metadata.
          html = re.sub(r"saltline", "blacktide", html, flags=re.IGNORECASE)

          title = "<title>BLACKTIDE — Operation Dead Current</title>"
          if re.search(r"<title[^>]*>.*?</title>", html, flags=re.IGNORECASE | re.DOTALL):
              html = re.sub(r"<title[^>]*>.*?</title>", title, html, count=1, flags=re.IGNORECASE | re.DOTALL)
          else:
              html = re.sub(r"<head([^>]*)>", r"<head\\1>\\n" + title, html, count=1, flags=re.IGNORECASE)

          description = '<meta name="description" content="BLACKTIDE — a browser-based first-person shooter in a storm-battered container port.">'
          if re.search(r'<meta[^>]+name=["\\']description["\\']', html, flags=re.IGNORECASE):
              html = re.sub(r'<meta[^>]+name=["\\']description["\\'][^>]*>', description, html, count=1, flags=re.IGNORECASE)
          else:
              html = re.sub(r"<head([^>]*)>", r"<head\\1>\\n" + description, html, count=1, flags=re.IGNORECASE)

          Path("index.html").write_text(html, encoding="utf-8")
          print(f"Imported original game ({len(html):,} characters) with branding-only edits.")
          PY

      - name: Replace project README
        run: |
          cat > README.md <<'EOF'
          # BLACKTIDE

          **Operation Dead Current** — the original Saltline browser FPS, rebranded with permission from the rights holder.

          ## Play locally

          Run: python -m http.server 8000

          Open http://localhost:8000 and click the game to capture the mouse and start.

          ## Game

          The original rainy container-port level, gameplay, Three.js rendering, procedural models, sound, enemies, objectives and mechanics are preserved. Only project branding and page metadata were changed.

          ## Controls

          Use the controls shown in the game's own interface. Press Esc to release the mouse.

          ## Credits

          Original game created by Felix Rieseberg using Claude Fable 5.2. This rebranded distribution was prepared with permission from the rights holder. BLACKTIDE is not affiliated with or endorsed by Anthropic.
          EOF

      - name: Remove one-time importer and commit the game
        run: |
          rm .github/workflows/import-saltline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md .github/workflows/import-saltline.yml
          git commit -m "Import original Saltline game and rebrand as BLACKTIDE"
          git push
