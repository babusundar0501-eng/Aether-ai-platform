name: AETHER checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q server.py
      - run: python -c "import server; assert server.health()['ok']; print('AETHER API import and health check passed')"
